[build-system]
requires = ["setuptools>=61,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "iss_simulation"
version = "0.1"
requires-python = "~= 3.11.0"
dependencies = [
    # Core numerical stack
    "numpy<2",
    "scipy",
    "pandas",
    "scikit-image",
    "scikit-learn",

    # Image processing
    # vismatch depends on opencv-python, so use the same distribution here
    # instead of installing opencv-python-headless in parallel.
    "opencv-python>=4.5.4,<4.12",
    "Pillow",
    "matplotlib",

    # Geospatial / astronomy
    "astropy",
    "skyfield",
    "rasterio",
    "shapely",
    "cartopy",

    # Utilities
    "requests",
    "tqdm",
    "exifread",
    "flow-vis",

    # Deep learning / neural matching
    "torch",
    "torchvision",
    "lightning==2.3.3",
    "vismatch==1.3.1",

    # Compatibility constraints required by the tested vismatch stack
    "rerun-sdk<0.23",
    "setuptools>=61,<81",
]

[project.optional-dependencies]
blender = ["bpy==4.4.0"]
